<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Weather Service</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        section { border: 1px solid #ccc; padding: 1rem; margin: 1rem 0; }
        input, button { padding: .5rem; margin: .25rem 0; }
        input { max-width: 18rem; width: 100%; }
        button { cursor: pointer; }
        pre { background: #f4f4f4; padding: 1rem; overflow: auto; }
    </style>
</head>
<body>
    <h1>Local Weather Service</h1>
    <section>
        <h2>Submit sensor reading</h2>
        <form id="reading-form">
            <input name="name" value="temperature-sensor" aria-label="Sensor name" required>
            <input name="address" value="Deakin University" aria-label="Sensor location" required>
            <input name="temperature" type="number" step="0.1" placeholder="Temperature (C)" required>
            <input name="humidity" type="number" min="0" max="100" placeholder="Humidity (%)">
            <button>Save reading</button>
        </form>
    </section>
    <section>
        <h2>Stored sensor data</h2>
        <button id="latest">Get latest temperature</button>
        <button id="all">Get all readings</button>
        <pre id="output">Choose an action.</pre>
    </section>
    <section>
        <h2>Weather-js lookup</h2>
        <form id="weather-form">
            <input name="location" value="Melbourne, AU" aria-label="Weather location" required>
            <button>Get location weather</button>
        </form>
    </section>
    <script>
        const output = document.querySelector('#output');
        const show = (data) => { output.textContent = JSON.stringify(data, null, 2); };
        const get = (url) => fetch(url).then(async (response) => {
            const data = await response.json();
            if (!response.ok) throw new Error(data.error);
            return data;
        });

        document.querySelector('#reading-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = new FormData(event.target);
            const reading = Object.fromEntries(form);
            reading.temperature = Number(reading.temperature);
            if (reading.humidity) reading.humidity = Number(reading.humidity);
            try {
                const response = await fetch('/api/readings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reading)
                });
                show(await response.json());
            } catch (error) { show({ error: error.message }); }
        });
        document.querySelector('#latest').onclick = () => get('/api/latest-temperature').then(show).catch((error) => show({ error: error.message }));
        document.querySelector('#all').onclick = () => get('/api/readings').then(show).catch((error) => show({ error: error.message }));
        document.querySelector('#weather-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const location = new FormData(event.target).get('location');
            get(`/api/weather?location=${encodeURIComponent(location)}`).then(show).catch((error) => show({ error: error.message }));
        });
    </script>
</body>
</html>
